# cargo-deny configuration. Run `cargo deny check` locally or in CI.
# Schema: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Each ignore names the parent crate that pulls in the advisory and what
# blocks the fix. Revisit when that parent crate is bumped.
#
# To prune stale ignores (e.g. after bumping Tauri / Leptos / the AWS SDK),
# temporarily add `unused-ignored-advisory = "warn"` under [advisories] and run
# `cargo deny check advisories`; delete any entry it flags with
# `warning[advisory-not-detected]`. Kept out of the committed config so CI logs
# stay free of warning noise.
ignore = [
    # --- rustls-pemfile pulled in by aws-smithy-http-client v1.1.x ---
    # Tracking via aws-sdk-rust upstream; update once aws-smithy-http-client
    # drops rustls-pemfile 1.x.
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile 1.x via aws-smithy-http-client; awaiting AWS SDK update" },

    # --- Tauri Linux backend (GTK3 / webkit2gtk) ---
    # Tauri 2.x has not migrated off GTK3. These advisories will clear when
    # Tauri ships a GTK4 backend or we drop the Linux target.
    { id = "RUSTSEC-2024-0411", reason = "gtk-rs GTK3 bindings via Tauri Linux backend" },
    { id = "RUSTSEC-2024-0412", reason = "gtk-rs GTK3 bindings via Tauri Linux backend" },
    { id = "RUSTSEC-2024-0413", reason = "gtk-rs GTK3 bindings via Tauri Linux backend" },
    { id = "RUSTSEC-2024-0414", reason = "gtk-rs GTK3 bindings via Tauri Linux backend" },
    { id = "RUSTSEC-2024-0415", reason = "gtk-rs GTK3 bindings via Tauri Linux backend" },
    { id = "RUSTSEC-2024-0416", reason = "gtk-rs GTK3 bindings via Tauri Linux backend" },
    { id = "RUSTSEC-2024-0417", reason = "gtk-rs GTK3 bindings via Tauri Linux backend" },
    { id = "RUSTSEC-2024-0418", reason = "gtk-rs GTK3 bindings via Tauri Linux backend" },
    { id = "RUSTSEC-2024-0419", reason = "gtk-rs GTK3 bindings via Tauri Linux backend" },
    { id = "RUSTSEC-2024-0420", reason = "gtk-rs GTK3 bindings via Tauri Linux backend" },
    { id = "RUSTSEC-2024-0436", reason = "paste unmaintained, transitive via webkit2gtk / Tauri" },

    # --- proc-macro-error via Tauri ---
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error unmaintained, transitive via Tauri" },

    # --- proc-macro-error2 via Leptos ---
    # Leptos (leptos_macro, leptos_router_macro, reactive_stores_macro, rstml)
    # still depends on it as of 0.8.16 / 0.9.0-alpha. Revisit on Leptos bumps.
    { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2 unmaintained, transitive via Leptos" },

    # --- mixpanel-rs (dotenv) ---
    { id = "RUSTSEC-2021-0141", reason = "dotenv unmaintained, transitive via mixpanel-rs" },

    # --- h2 0.3 via mixpanel-rs ---
    # Denial of service, low severity: h2 accepts and queues empty DATA frames
    # without limit, so a stream that is never drained can grow unboundedly.
    # Reached only as an outbound client to Mixpanel's ingest API; nothing in
    # the workspace serves HTTP over hyper 0.14, and a local build never even
    # constructs the client (`Sink::DryRun`).
    #
    # Not fixable in place: the advisory patches `>= 0.4.16` and the 0.3 line
    # has no patched release at all, while mixpanel-rs 0.3.1 is its latest and
    # pins reqwest 0.11. Clears when mixpanel-rs moves to reqwest 0.12+, or when
    # we replace it. Our own h2 0.4 is patched — 0.4.19 in Cargo.lock.
    #
    # Note this ignore is by advisory id, which is all cargo-deny supports here,
    # so it would also mask a future h2 0.4 regression under the same id.
    { id = "RUSTSEC-2026-0258", reason = "h2 0.3 via mixpanel-rs -> reqwest 0.11 -> hyper 0.14; no patched 0.3 release exists" },

    # --- zip 4.x via tauri-plugin-updater (Windows only) ---
    # Upstream yanked every zip release before 9.0.3 for extraction bugs.
    # tauri-plugin-updater, up to 2.14.0 and 3.0.0-alpha, still requires
    # zip ^4. It only unpacks our own update bundles after checking their
    # signature. Drop this when the updater moves to zip 9.
    { crate = "zip@4.6.1", reason = "yanked; tauri-plugin-updater still requires zip ^4" },
    # The same zip 4 also carries three extraction advisories (SUID bits,
    # symlink targets, permissions through symlinks), all fixed only in zip 9.
    # They need an attacker-controlled archive; the updater extracts only our
    # signed update bundles, and only on Windows.
    { id = "RUSTSEC-2026-0367", reason = "zip 4 via tauri-plugin-updater; only extracts signed update bundles" },
    { id = "RUSTSEC-2026-0368", reason = "zip 4 via tauri-plugin-updater; only extracts signed update bundles" },
    { id = "RUSTSEC-2026-0369", reason = "zip 4 via tauri-plugin-updater; only extracts signed update bundles" },

    # --- zbus 5 helper crates via opener / tauri-plugin-single-instance (Linux only) ---
    # zbus 6 folded zbus_names, zvariant and zvariant_derive into itself, so the
    # standalone crates are unmaintained. opener 0.9 and
    # tauri-plugin-single-instance 2.5 still require zbus 5. Drop these when
    # both move to zbus 6.
    { id = "RUSTSEC-2026-0370", reason = "zvariant unmaintained, via zbus 5 from opener / tauri-plugin-single-instance" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names unmaintained, via zbus 5 from opener / tauri-plugin-single-instance" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive unmaintained, via zbus 5 from opener / tauri-plugin-single-instance" },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# `quilt-sync`/`quilt-sync-ui` depend on workspace siblings via `path = "..."`
# without a version, which Cargo records as `*`. That's expected for path
# deps — only flag wildcards on registry crates.
allow-wildcard-paths = true
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
