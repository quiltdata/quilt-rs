[toolchain]
# Pinned, not floating "stable". CI runs `cargo clippy -- --deny warnings` with
# `-D clippy::pedantic`, so a new stable release can turn a fresh pedantic lint into a
# build failure on every branch at once with no code change. That happened on
# 2026-08-18: rustc 1.98.0 added `clippy::unused_async_trait_impl` to the pedantic
# group, and main went from green (last: 2026-08-07, rustc 1.97.1) to failing on 26
# pre-existing sites across 4 files — taking every open PR down with it.
#
# Bumping this pin is now a deliberate PR that surfaces new lints in isolation
# instead of breaking the whole repo. See PR #866.
#
# Note: this pin does NOT make CI green on its own. `cargo-deny` fails independently
# on RUSTSEC-2026-0258 (h2) and RUSTSEC-2026-0249 (smartstring); those need their own
# fixes.
channel = "1.97.1"
components = ["rustfmt", "clippy", "rust-analyzer"]
