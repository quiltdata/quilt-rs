name: "Setup Rust (Minimal)"
description: "Setup Rust toolchain without extra components for building/testing"
inputs:
  cache-target:
    description: "Build profile the job compiles (debug or release); each gets its own cache"
    required: false
    default: "debug"
  cache-key:
    description: "Extra cache key part, for matrix legs that differ only in the target they build"
    required: false
    default: ""
  targets:
    description: "Additional targets to install"
    required: false
    default: ""
  components:
    description: "Additional components to install, such as clippy"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Setup Rust
      uses: moonrepo/setup-rust@v1
      with:
        # Its cache is one per OS, shared by every job. rust-cache below keeps one per job.
        cache: false
        targets: ${{ inputs.targets }}
        components: ${{ inputs.components }}

    - name: Cache Rust build
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        # The job id is in the key already, but `quality` is a job in two workflows.
        key: ${{ github.workflow }}-${{ inputs.cache-target }}${{ inputs.cache-key && format('-{0}', inputs.cache-key) || '' }}
        # Pull requests restore main's caches and never write their own.
        save-if: ${{ github.ref == 'refs/heads/main' }}
