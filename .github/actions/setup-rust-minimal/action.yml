name: "Setup Rust (Minimal)"
description: "Setup Rust toolchain without extra components for building/testing"
inputs:
  cache-target:
    description: "Cache target profile (debug or release)"
    required: false
    default: "debug"
  targets:
    description: "Additional targets to install"
    required: false
    default: ""
  github-token:
    description: >-
      Token for cargo-binstall's GitHub API lookups. Pass a read-only token;
      without one, shared runner IPs can hit the rate limit and hang the step.
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Setup Rust
      uses: moonrepo/setup-rust@v1
      # cargo-binstall (used to install cargo-cache) reads GITHUB_TOKEN.
      # Opt-in, so release jobs never hand their write token to this action.
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
      with:
        cache-base: main
        cache-target: ${{ inputs.cache-target }}
        targets: ${{ inputs.targets }}
