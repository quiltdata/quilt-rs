name: "Setup Rust for Development"
description: "Setup Rust toolchain with clippy and rustfmt for development/testing"
inputs:
  targets:
    description: "Additional targets to install"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Setup Rust
      uses: moonrepo/setup-rust@v1
      # cargo-binstall (used to install cargo-cache) queries the GitHub API.
      # Without a token, shared runner IPs hit the rate limit and it retries
      # until the job times out.
      env:
        GITHUB_TOKEN: ${{ github.token }}
      with:
        cache-base: main
        cache-target: debug
        inherit-toolchain: true
        targets: ${{ inputs.targets }}
