name: "Install Ubuntu Dependencies"
description: "Install system dependencies required for Tauri on Ubuntu"

runs:
  using: "composite"
  steps:
    # The image's package index goes stale, and a stale one makes a cache miss fail on removed versions
    - name: Update package index
      shell: bash
      run: sudo apt-get update

    # The runner's Ubuntu mirror is sometimes slow enough to stall the job, so packages come from the cache
    - name: Install dependencies
      uses: awalsh128/cache-apt-pkgs-action@v1
      with:
        packages: libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev mold
        version: 1
