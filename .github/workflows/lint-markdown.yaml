name: Lint Markdown

on:
  push:
    # Only `main` — see test-quilt-rs.yaml.
    branches: [main]
    paths:
      - '**/*.md'
      - '.github/workflows/lint-markdown.yaml'
  pull_request:
    paths:
      - '**/*.md'
      - '.github/workflows/lint-markdown.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-markdown:
    name: Markdown Linting
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # The project's own action downloads the release binary and checks its
      # sha256. Pinned by commit: it is third-party code. It installs the
      # latest rumdl, as a local `cargo install rumdl` does.
      - name: Install rumdl
        uses: rvben/rumdl@1e0f1d13c87418c31e0d59dacddd98f27a02efcc # v0.3.2
        with:
          install-only: true

      - name: Lint markdown files
        run: rumdl check .
