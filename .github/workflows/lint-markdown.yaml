name: Lint Markdown

on:
  push:
    # Only `main` — see test-quilt-rs.yaml.
    branches: [main]
    paths:
      - '**/*.md'
      - '.github/workflows/lint-markdown.yaml'
  pull_request:
    paths:
      - '**/*.md'
      - '.github/workflows/lint-markdown.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-markdown:
    name: Markdown Linting
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # The project's own action downloads the release binary and checks its
      # sha256, where `cargo install` spent minutes compiling it. Keep the two
      # versions equal: Renovate bumps the `uses:` tag but not `version:`.
      - name: Install rumdl
        uses: rvben/rumdl@v0.2.78
        with:
          version: 0.2.78
          install-only: true

      - name: Lint markdown files
        run: rumdl check .
