name: Release QuiltSync

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment"
        type: environment
        required: true

jobs:
  # Creates the draft once, before the matrix, and hands its numeric id to
  # every leg. With a tag-only lookup, legs that reached tauri-action at the
  # same moment each created their own draft and split the platforms (and
  # `latest.json`) between them.
  create-release:
    name: Create draft release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      id: ${{ steps.draft.outputs.id }}
      version: ${{ steps.draft.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Find or create the draft
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # tauri.conf.json has no `version`, so tauri-action takes the
          # app version from this Cargo.toml.
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("quilt-sync/src-tauri/Cargo.toml", "rb"))["package"]["version"])')
          tag="QuiltSync/v$version"
          releases=$(gh api --paginate "repos/$REPO/releases" \
            --jq "[.[] | select(.tag_name == \"$tag\") | {id, draft}]" | jq -s 'add // []')
          count=$(jq length <<<"$releases")
          if [ "$count" -gt 1 ]; then
            echo "::error::$count releases already use tag $tag; delete the extra ones first"
            exit 1
          elif [ "$count" -eq 1 ]; then
            [ "$(jq '.[0].draft' <<<"$releases")" = true ] \
              || { echo "::error::$tag is already published"; exit 1; }
            id=$(jq '.[0].id' <<<"$releases")
            echo "Reusing draft $id for $tag"
          else
            id=$(gh api -X POST "repos/$REPO/releases" \
              -f tag_name="$tag" \
              -f target_commitish="$GITHUB_SHA" \
              -f name="QuiltSync v$version" \
              -f body="See the assets to download and install this version." \
              -F draft=true \
              -F prerelease=false \
              --jq .id)
            echo "Created draft $id for $tag"
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  release:
    name: Build Release
    needs: create-release
    permissions:
      contents: write
      id-token: write  # required for Azure OIDC token request
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-15" # for Arm based macs (M1 and above).
            args: "--target aarch64-apple-darwin"
          - platform: "macos-15" # for Intel based macs.
            args: "--target x86_64-apple-darwin"
          - platform: "ubuntu-24.04"
            args: ""
          - platform: "windows-latest"
            args: ""
    runs-on: ${{ matrix.platform }}
    environment: ${{ inputs.environment }}
    env:
      # Use mold linker on Linux to avoid OOM crashes on memory-constrained CI runners
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=mold"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Ubuntu dependencies
        if: matrix.platform == 'ubuntu-24.04'
        uses: ./.github/actions/install-ubuntu-deps

      - name: Setup Rust for release
        uses: ./.github/actions/setup-rust-minimal
        with:
          cache-target: release
          # Both macOS legs run on one runner type; only `args` tells them apart.
          cache-key: ${{ matrix.args }}
          targets: ${{ matrix.platform == 'macos-15' && 'aarch64-apple-darwin,x86_64-apple-darwin,wasm32-unknown-unknown' || 'wasm32-unknown-unknown' }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: 'quilt-sync/ui/package-lock.json'

      - name: Install trunk
        uses: taiki-e/install-action@trunk

      # Trunk's pre_build hook shells out to `stylance` (quilt-sync/ui/Trunk.toml).
      # Pinned to the `stylance` library version in quilt-sync/ui/Cargo.toml.
      - name: Install stylance
        uses: taiki-e/install-action@v2
        with:
          tool: stylance-cli@0.8.4

      - name: Build the app
        id: tauri
        uses: tauri-apps/tauri-action@v1
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MIXPANEL_API_SECRET: ${{ secrets.MIXPANEL_API_SECRET }}
          MIXPANEL_PROJECT_TOKEN: ${{ vars.MIXPANEL_PROJECT_TOKEN }}
          SENTRY_DSN: ${{ vars.SENTRY_DSN }}
          # Auto updater signing keys - required for cryptographic verification
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # A numeric id makes tauri-action upload straight to that release
          # and ignore tagName, releaseName and releaseDraft.
          releaseId: ${{ needs.create-release.outputs.id }}
          # Becomes the `notes` field of latest.json.
          releaseBody: "See the assets to download and install this version."
          args: ${{ matrix.args }}
          projectPath: "./quilt-sync"
          # Auto updater configuration - generates latest.json for update checks.
          # (updaterJsonKeepUniversal was removed in tauri-action v1 — universal
          # macOS builds are now always kept in latest.json.)
          updaterJsonPreferNsis: false

      # Windows Authenticode code signing via Azure Trusted Signing.
      # We authenticate immediately before signing (not before the build) so the
      # OIDC token hasn't expired after the ~25 minute build.
      # See docs/windows-signing.md for setup instructions.
      - name: Azure login (OIDC)
        if: matrix.platform == 'windows-latest'
        uses: azure/login@v3
        with:
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sign Windows artifacts with Azure Trusted Signing
        if: matrix.platform == 'windows-latest'
        uses: azure/trusted-signing-action@v2
        with:
          azure-tenant-id: ${{ vars.AZURE_TENANT_ID }}
          azure-client-id: ${{ vars.AZURE_CLIENT_ID }}
          endpoint: ${{ vars.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_TRUSTED_SIGNING_PROFILE }}
          files-folder: target/release/bundle
          files-folder-filter: exe,msi
          files-folder-recurse: true
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          file-digest: SHA256

  # Single approval gate that flips the draft to public, marks it as
  # "latest", and dispatches `upload-to-hubspot.yaml` — the two surfaces
  # used to be a manual `gh release edit` plus a separate Actions-tab
  # click. The HubSpot mirror is the actual rollout switch (HubFS is
  # the sole `latest.json` endpoint after the fallback was dropped from
  # `tauri.conf.json`), so "GH public, HubSpot pending" is invisible to
  # clients and re-running just this job recovers from a flake on
  # either side.
  promote:
    needs: [create-release, release]
    runs-on: ubuntu-24.04
    # Shared with the crate `publish` gate — same approval policy
    # applies to both irreversible channels.
    environment: release-approval
    permissions:
      contents: write
      actions: write  # required for `gh workflow run`
    steps:
      - name: Check the draft is the only release and covers every platform
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RELEASE_ID: ${{ needs.create-release.outputs.id }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          set -euo pipefail
          [ -n "$RELEASE_ID" ] || { echo "::error::create-release.outputs.id is empty"; exit 1; }
          tag="QuiltSync/v$VERSION"
          count=$(gh api --paginate "repos/$REPO/releases" \
            --jq "[.[] | select(.tag_name == \"$tag\")] | length" | jq -s add)
          [ "$count" -eq 1 ] \
            || { echo "::error::$count releases use tag $tag; expected exactly one"; exit 1; }
          asset=$(gh api "repos/$REPO/releases/$RELEASE_ID/assets" --paginate \
            --jq '.[] | select(.name == "latest.json") | .id')
          [ -n "$asset" ] || { echo "::error::draft $RELEASE_ID has no latest.json"; exit 1; }
          gh api -H "Accept: application/octet-stream" \
            "repos/$REPO/releases/assets/$asset" > latest.json
          missing=$(jq -r '
            ["linux-x86_64", "linux-x86_64-deb",
             "darwin-aarch64", "darwin-aarch64-app",
             "darwin-x86_64", "darwin-x86_64-app",
             "windows-x86_64", "windows-x86_64-msi"]
            - (.platforms | keys) | join(" ")' latest.json)
          [ -z "$missing" ] \
            || { echo "::error::latest.json is missing platforms: $missing"; exit 1; }

      - name: Promote draft and trigger HubSpot mirror
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RELEASE_ID: ${{ needs.create-release.outputs.id }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          set -euo pipefail
          tag="QuiltSync/v$VERSION"
          gh api -X PATCH "repos/$REPO/releases/$RELEASE_ID" \
            -F draft=false -f make_latest=true --silent
          gh workflow run upload-to-hubspot.yaml \
            --repo "$REPO" \
            -f release_tag="$tag"
          {
            echo "## QuiltSync $tag promoted"
            echo
            echo "- GitHub release marked public + latest"
            echo "- \`upload-to-hubspot.yaml\` dispatched (mirrors to HubFS + HubDB)"
          } >> "$GITHUB_STEP_SUMMARY"
