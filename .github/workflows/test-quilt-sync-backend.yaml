name: Test QuiltSync

on:
  # Toolchain canary — see test-quilt-rs.yaml. Holds the only clippy run for
  # `quilt-sync/src-tauri`, so it needs its own schedule.
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
  push:
    # Only `main` — see test-quilt-rs.yaml.
    branches: [main]
    paths-ignore:
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "**/*.md"

# Read-only: the token is passed to third-party setup actions.
permissions:
  contents: read

concurrency:
  # `event_name` so a scheduled run and a push to main cannot cancel each other.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  quality:
    name: Code Quality (Ubuntu)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      # Use mold linker on Linux to avoid OOM crashes on memory-constrained CI runners
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Ubuntu dependencies
        uses: ./.github/actions/install-ubuntu-deps

      - name: Setup Rust for development
        uses: ./.github/actions/setup-rust-dev
        with:
          github-token: ${{ github.token }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Format
        run: cargo fmt --check
        working-directory: ./quilt-sync/src-tauri

      - name: Lint
        run: cargo clippy --all-targets --all-features -- --deny warnings
        working-directory: ./quilt-sync/src-tauri

      # Two steps, for the reason given in test-quilt-rs.yaml.
      - name: Test
        run: cargo nextest run --profile no-aws
        working-directory: ./quilt-sync/src-tauri
        env:
          RUST_BACKTRACE: 1
          RUST_LOG: debug
          # See test-quilt-rs.yaml.
          AWS_EC2_METADATA_DISABLED: true

      - name: Test (live AWS fixtures)
        # Secrets reach a pull request only from a branch in this repository —
        # a platform rule, so this is a skip, not a failure.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: cargo nextest run -E 'test(/::live_/)'
        working-directory: ./quilt-sync/src-tauri
        env:
          RUST_BACKTRACE: 1
          RUST_LOG: debug
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  cross-platform:
    name: Cross-Platform Tests
    # Scheduled runs are on `main`, so the canary covers macOS and Windows too.
    # No Ubuntu here: `quality` already runs the same tests there.
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        platform: [macos-15, windows-latest]
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Rust for testing
        uses: ./.github/actions/setup-rust-minimal
        with:
          github-token: ${{ github.token }}
          targets: ${{ matrix.platform == 'macos-15' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      # Two steps, for the reason given in test-quilt-rs.yaml.
      - name: Test
        run: cargo nextest run --profile no-aws
        working-directory: ./quilt-sync/src-tauri
        env:
          RUST_BACKTRACE: 1
          AWS_EC2_METADATA_DISABLED: true
