name: Test QuiltSync Frontend

on:
  # Toolchain canary — see test-quilt-rs.yaml. Holds the only clippy run for
  # `quilt-sync/ui`, so it needs its own schedule.
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
  push:
    # Only `main` — see test-quilt-rs.yaml.
    branches: [main]
    paths-ignore:
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "**/*.md"

# Read-only: the token is passed to third-party setup actions.
permissions:
  contents: read

concurrency:
  # `event_name` so a scheduled run and a push to main cannot cancel each other.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  quality:
    name: Frontend Quality (Ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: ./.github/actions/setup-rust-dev
        with:
          github-token: ${{ github.token }}
          targets: wasm32-unknown-unknown

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'quilt-sync/ui/package-lock.json'

      - name: Install trunk
        uses: taiki-e/install-action@trunk

      - name: Format
        run: cargo fmt --check -p quilt-sync-ui

      - name: Lint
        run: cargo clippy --target wasm32-unknown-unknown -p quilt-sync-ui --all-targets --all-features -- --deny warnings

      - name: Determine wasm-bindgen version
        id: wasm-bindgen-version
        run: |
          version=$(cargo metadata --format-version 1 --locked \
            | jq -r '.packages[] | select(.name == "wasm-bindgen") | .version')
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Install wasm-bindgen-cli
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@${{ steps.wasm-bindgen-version.outputs.version }}

      # `WASM_BINDGEN_TEST_TIMEOUT` limits only the wait for the tests to
      # finish; browser start and page load have their own limits. Past it the
      # runner fails with "Failed to detect test as having been run" and names
      # no test. It is a hang guard, set well above the suite's time.
      #
      # The suite's time is watched against a smaller budget instead: over it,
      # the step warns but stays green, so growth shows long before the
      # timeout. `pipefail` keeps a test failure failing the step.
      - name: Test
        shell: bash
        run: |
          set -eo pipefail
          cargo test -p quilt-sync-ui --target wasm32-unknown-unknown 2>&1 \
            | tee "$RUNNER_TEMP/wasm-test.log"
          secs=$(grep -oE 'finished in [0-9.]+s' "$RUNNER_TEMP/wasm-test.log" \
            | grep -oE '[0-9.]+' | sort -n | tail -1 || true)
          if [ -n "$secs" ] && awk -v s="$secs" -v b="$BUDGET_SECS" 'BEGIN { exit !(s > b) }'; then
            echo "::warning title=Wasm test suite time::The wasm tests took ${secs}s, over the ${BUDGET_SECS}s budget (timeout ${WASM_BINDGEN_TEST_TIMEOUT}s). Speed up or split the suite."
          fi
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
          WASM_BINDGEN_TEST_TIMEOUT: "180"
          BUDGET_SECS: "75"

      # This crate has tests for two targets, and neither harness runs the
      # other's: `wasm-bindgen-test-runner` runs only `#[wasm_bindgen_test]`, and
      # libtest runs only `#[test]`. The step above runs the wasm tests; this step
      # runs the host tests. Without it, no `#[test]` in this crate runs in CI.
      #
      # DOM tests cannot run here, because `mount_to` and similar helpers are
      # wasm-bindgen bindings into JS. Pure-logic tests could move to wasm
      # instead. Once v1 is deleted only about twenty host tests remain, and
      # converting them and removing this step becomes the cheaper option.
      #
      # `--lib --bins`, not `--bin quilt-sync-ui`: most of the tests are in the
      # library target, and `--bin` alone runs only the few in the binary.
      - name: Test (host target)
        run: cargo test -p quilt-sync-ui --lib --bins

      # Trunk's pre_build hook shells out to `stylance` (quilt-sync/ui/Trunk.toml).
      # Pinned to the `stylance` library version in quilt-sync/ui/Cargo.toml: the
      # CLI generates the hashed class names the library resolves, so a skew
      # between them breaks styling silently rather than loudly.
      - name: Install stylance
        uses: taiki-e/install-action@v2
        with:
          tool: stylance-cli@0.8.4

      - name: Build
        run: trunk build --release
        working-directory: ./quilt-sync/ui
