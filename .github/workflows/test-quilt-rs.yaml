name: Test quilt_rs

on:
  # Toolchain canary: `rust-toolchain.toml` floats on `stable` and
  # `setup-rust-dev` inherits it, so every run resolves a fresh compiler.
  # Without a schedule, a new release is first seen when it breaks some PR.
  schedule:
    # Off the hour: scheduled runs on the hour contend for runners.
    - cron: "17 7 * * *"
  workflow_dispatch:
  push:
    # Only `main`: a pull request branch already runs on `pull_request`, and
    # a `push` run too would test every commit there twice.
    branches: [main]
    # Ignore only crates downstream of what this job builds: Cargo forbids
    # dependency cycles, so nothing here can depend on quilt-sync, which its
    # `--exclude` flags name below. An upstream crate would skip a real check.
    paths-ignore:
      - "**/*.md"
      - "quilt-sync/**"
  pull_request:
    # Same filter as `push`: see the note above.
    paths-ignore:
      - "**/*.md"
      - "quilt-sync/**"

# Read-only: third-party actions run with this token.
permissions:
  contents: read

concurrency:
  # `event_name` so a scheduled run and a push to main cannot cancel each other.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  workspace:
    name: workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # This runner has no Tauri system libraries, so it cannot build
      # `quilt-sync`; `quilt-sync-ui` is wasm-only. Both have their own
      # workflow. Named once here because two steps below select on it.
      SCOPE: --workspace --all-targets --exclude quilt-sync --exclude quilt-sync-ui
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Rust for development
        uses: ./.github/actions/setup-rust-dev
        with:
          targets: wasm32-unknown-unknown

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features --exclude quilt-sync --exclude quilt-sync-ui -- --deny warnings

      - name: Check WASM build (quilt-uri, default features)
        run: cargo check -p quilt-uri --target wasm32-unknown-unknown

      - name: Check WASM build (quilt-uri, all features)
        run: cargo check -p quilt-uri --target wasm32-unknown-unknown --all-features

      # Split in two so a fork pull request is not a different, quieter run of
      # the same step. Everything that needs no credentials runs everywhere;
      # the fixture tests are their own step, skipped where GitHub withholds
      # secrets. With `live-writes`, the selections partition the suite — none
      # overlaps.
      - name: Test
        run: cargo nextest run --profile no-aws $SCOPE
        env:
          RUST_BACKTRACE: 1
          # No credentials here by design. Skip the IMDS probe so a test that
          # reaches for AWS fails with a credentials error in a moment, rather
          # than timing out against an endpoint the runner does not have.
          AWS_EC2_METADATA_DISABLED: true

      - name: Test (live AWS fixtures)
        # Secrets reach a pull request only from a branch in this repository —
        # a platform rule, so this is a skip, not a failure.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        # The tests that write to S3 run in `live-writes`.
        run: cargo nextest run $SCOPE -E 'test(/::live_/) and not test(/::live_write_/)'
        env:
          RUST_BACKTRACE: 1
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Test doctests
        run: cargo test --doc --workspace --exclude quilt-sync --exclude quilt-sync-ui
        env:
          RUST_BACKTRACE: 1
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  cross-platform:
    name: workspace (${{ matrix.platform }})
    # The tests of `workspace` on the other OSes. Only on `main`, scheduled
    # runs included: pull requests test on Linux only, so an OS-specific bug
    # shows up here, after the merge.
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-15, windows-latest]
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45
    env:
      # Same crates as `workspace`, for the reason given there.
      SCOPE: --workspace --all-targets --exclude quilt-sync --exclude quilt-sync-ui
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Rust for testing
        uses: ./.github/actions/setup-rust-minimal
        with:
          components: clippy

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      # The only lint of code built for this OS alone. Linux cannot lint it
      # for the other target: aws-lc-rs compiles C for the target it builds.
      - name: Lint
        shell: bash
        run: cargo clippy $SCOPE --all-features -- --deny warnings

      # `--no-fail-fast`, and every step runs after a failure: one run should
      # list every failure, not just the first. Bash on Windows, because
      # PowerShell reads `$SCOPE` as its own variable, not the environment's.
      - name: Test
        if: ${{ !cancelled() }}
        shell: bash
        run: cargo nextest run --profile no-aws --no-fail-fast $SCOPE
        env:
          RUST_BACKTRACE: 1
          AWS_EC2_METADATA_DISABLED: true

      - name: Test (live AWS fixtures)
        # Same rule as in `workspace`.
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        shell: bash
        # The tests that write to S3 run in `live-writes`.
        run: cargo nextest run --no-fail-fast $SCOPE -E 'test(/::live_/) and not test(/::live_write_/)'
        env:
          RUST_BACKTRACE: 1
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  live-writes:
    name: live writes (${{ matrix.platform }})
    # The `live_write_*` tests, which write to S3: some push a shared fixture
    # package and then restore it, so two at once would see each other's
    # in-between revisions. The group is shared by every run of every
    # workflow, so only one of these jobs runs at a time; the queue keeps every
    # waiting job, where the default would cancel all but the newest.
    concurrency:
      group: live-s3-writes
      cancel-in-progress: false
      queue: max
    # Same rule as the live step in `workspace`. Windows on `main` only, as
    # in `cross-platform`. No macOS: it shares Linux's Unix semantics, and
    # every leg here waits for the one before it.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ github.ref == 'refs/heads/main' && fromJSON('["ubuntu-24.04", "windows-latest"]') || fromJSON('["ubuntu-24.04"]') }}
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45
    env:
      # Same crates as `workspace`, for the reason given there.
      SCOPE: --workspace --all-targets --exclude quilt-sync --exclude quilt-sync-ui
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Rust for testing
        uses: ./.github/actions/setup-rust-minimal

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      # Bash, for the reason given in `cross-platform`.
      - name: Test (live AWS fixture writes)
        shell: bash
        run: cargo nextest run --no-fail-fast $SCOPE -E 'test(/::live_write_/)'
        env:
          RUST_BACKTRACE: 1
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # A prebuilt binary, not EmbarkStudios/cargo-deny-action: that action builds
      # a Docker image from Docker Hub, and anonymous pulls hit its rate limit.
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: cargo deny check
        run: cargo deny --all-features check
