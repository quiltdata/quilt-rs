[build]
target = "index.html"
dist = "dist"
filehash = false

[watch]
watch = ["src", "index.html", "gallery.html", "assets", "../../quilt-ui-kit/src", "../../quilt-ui-kit/css"]
# Generated into a watched directory: without the ignore, each build rewrites
# them, the watcher fires, and Trunk rebuilds forever. Sources stay watched.
ignore = ["assets/js/json-editor.js", "assets/css/kit/modules.css", "../../quilt-ui-kit/css/kit-modules.css"]

# Bundle vanilla-jsoneditor before Trunk compiles the WASM crate.
# The glue JS source lives in js/; the output lands in assets/js/
# where index.html picks it up via <script src="assets/js/json-editor.js">.
[[hooks]]
stage = "pre_build"
command = "sh"
command_arguments = ["-c", "npm install --prefer-offline --no-audit --no-fund && npx esbuild js/json-editor-glue.js --bundle --format=iife --outfile=assets/js/json-editor.js"]

# CSS Modules, the pages' and the kit's. Runs before Trunk reads the
# stylesheets, so the generated bundles are current. Needs `cargo install
# stylance-cli`; a missing tool fails the build here, which is wanted — skipping
# it would render every class as nothing.
[[hooks]]
stage = "pre_build"
command = "stylance"
command_arguments = ["."]

[[hooks]]
stage = "pre_build"
command = "stylance"
command_arguments = ["../../quilt-ui-kit"]
