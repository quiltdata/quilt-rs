[build]
target = "index.html"
dist = "dist"
filehash = false

[watch]
watch = ["src", "index.html", "gallery.html", "assets"]
# Both entries are GENERATED INTO a watched directory, so without ignoring them
# each build would rewrite them, the watcher would notice, and Trunk would
# rebuild forever. `json-editor.js` (esbuild) set the precedent; `_modules.scss`
# (stylance) is the same shape. The *sources* are watched — edit
# `src/kit/**/style.module.scss` and the rebuild picks it up.
ignore = ["assets/js/json-editor.js", "assets/css/kit/_modules.scss"]

# Bundle vanilla-jsoneditor before Trunk compiles the WASM crate.
# The glue JS source lives in js/; the output lands in assets/js/
# where index.html picks it up via <script src="assets/js/json-editor.js">.
[[hooks]]
stage = "pre_build"
command = "sh"
command_arguments = ["-c", "npm install --prefer-offline --no-audit --no-fund && npx esbuild js/json-editor-glue.js --bundle --format=iife --outfile=assets/js/json-editor.js"]

# CSS Modules: hash every class in `src/kit/**/*.module.scss` and concatenate them
# into the generated `assets/css/kit/_modules.scss`, which the scss entrypoints
# `@use`. Must run before the build so sass sees a current file — hence
# pre_build rather than a watch of its own.
#
# `stylance` comes from `cargo install stylance-cli`. If it is missing the build
# fails loudly here, which is the failure mode we want: silently skipping it
# would produce a page whose classes resolve to nothing.
[[hooks]]
stage = "pre_build"
command = "stylance"
command_arguments = ["."]
