<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuiltSync design system — gallery</title>

  <!--
    Debug harness and design record. Its own Trunk target so it mounts
    `Gallery`, never `App` — `App` invokes on mount and the Tauri bridge has no
    `catch`, so in a plain browser it traps the wasm module. Run: `just gallery`
    (debug) or `just gallery preview` (release).

    No fonts are linked: the system stack lives in tokens.css. v1's index.html
    pulls 1.2 MB of Roboto; none of it is wanted here.
  -->
  <!--
    Plain CSS, linked in cascade order: the reset, the tokens, the global base,
    the generated CSS-Module bundle, and the gallery's own chrome. Tokens and
    chrome stay hand-written and global on purpose: tokens declare `:root`
    custom properties and chrome styles `body`, neither of which a CSS Module
    can scope.

    Adding a component never touches this file, and never touches an index
    either: a component declares its own stylesheet in Rust via
    `import_crate_style!`, and `stylance-cli` discovers every
    `src/kit/*.module.css` and concatenates them into `modules.css`.
  -->
  <link data-trunk rel="css" href="assets/css/kit/normalize.css" />
  <link data-trunk rel="css" href="assets/css/kit/tokens.css" />
  <link data-trunk rel="css" href="assets/css/kit/base.css" />
  <link data-trunk rel="css" href="assets/css/kit/modules.css" />
  <link data-trunk rel="css" href="assets/css/kit/chrome.css" />
  <link data-trunk rel="css" href="assets/css/kit/old_revisions_inline.css" />
  <!-- The appbar's mark, for the whole-page scenes; the app's index.html copies all of assets/. -->
  <link data-trunk rel="copy-dir" href="assets/img" data-target-path="assets/img" />

  <!-- The metadata editor, for the commit page scene: the same bundle the app's
       index.html loads, written by Trunk.toml's pre-build hook. -->
  <link data-trunk rel="copy-file" href="assets/js/json-editor.js" data-target-path="assets/js" />
  <script src="assets/js/json-editor.js"></script>

  <link data-trunk rel="rust" data-bin="gallery" data-wasm-opt="z" />
</head>
<body></body>
</html>
