[package]
name = "quilt-sync-ui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
homepage.workspace = true
publish = false

# Both declared, because adding one `[[bin]]` disables auto-discovery of the
# other. `gallery` sits in `src/`, not `src/bin/`, so `mod kit;` resolves.
[[bin]]
name = "quilt-sync-ui"
path = "src/main.rs"

[[bin]]
name = "gallery"
path = "src/gallery.rs"

[dependencies]
leptos = { version = "0.8.20", features = ["csr"] }
leptos_router = "0.8.15"
wasm-bindgen = "0.2.126"
wasm-bindgen-futures = "0.4.76"
js-sys = "0.3.103"
web-sys = { version = "0.3.103", features = ["Document", "Element", "HtmlDialogElement", "HtmlElement", "HtmlFormElement", "HtmlTextAreaElement", "Storage", "Window", "Location"] }
serde.workspace = true
serde-wasm-bindgen = "0.6.5"
console_error_panic_hook = "0.1.7"
serde_json.workspace = true
urlencoding = "2.1.3"
quilt-uri = { path = "../../quilt-uri" }
send_wrapper = "0.6.0"
stylance = "0.8.4"

# CSS Modules. `stylance-cli` scans `folders` recursively, hashes each class, and
# concatenates into `output_file` — so a component declares its own stylesheet
# from Rust and no list of stylesheets exists. Output is generated and
# gitignored; Trunk's pre_build hook rebuilds it.
[package.metadata.stylance]
output_file = "./assets/css/kit/_modules.scss"
folders = ["./src/kit/"]
extensions = [".module.scss"]

[dev-dependencies]
wasm-bindgen-test = "0.3.76"
web-sys = { version = "0.3.103", features = ["DomTokenList", "Element", "HtmlButtonElement", "Node"] }

[lints]
workspace = true
