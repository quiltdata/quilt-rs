  <!--
    The first paint, before the wasm module exists. `theme::follow_os` and
    `theme::set_v2` set these same two things, but only once Rust is running, and
    a document with no theme and no marker paints white whatever the OS says.

    The stored generation is last session's answer, not this one's: `/` resolves
    the real one — the reader's *New design preview* answer — and `set_v2`
    corrects the marker. A first-ever launch has nothing stored and opens light,
    as does the first launch after the key was renamed from
    `quiltsync.main-page-v2`.

    `data-booting` keeps this to the empty frame — `_base.scss` hangs the dark
    canvas off it, and `main` clears it before the mount.
  -->
  <script>
    (function () {
      var root = document.documentElement;
      try {
        if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
          root.setAttribute("data-theme", "dark");
        } else {
          root.setAttribute("data-theme", "light");
        }
      } catch (e) {}
      try {
        if (window.localStorage.getItem("quiltsync.design-preview") === "1") {
          root.classList.add("qui-v2");
          root.setAttribute("data-booting", "");
        }
      } catch (e) {}
    })();
  </script>
