<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuiltSync</title>
  <!--
    The first paint, before the wasm module exists. `theme::follow_os` sets the
    theme too, but only once Rust is running, and a document with no theme paints
    white whatever the OS says.

    `data-booting` keeps this to the empty frame — `base.css` hangs the dark
    canvas off it, and `main` clears it before the mount.
  -->
  <script>
    (function () {
      var root = document.documentElement;
      try {
        if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
          root.setAttribute("data-theme", "dark");
        } else {
          root.setAttribute("data-theme", "light");
        }
      } catch (e) {}
      root.setAttribute("data-booting", "");
    })();
  </script>
  <!-- copy assets into dist/, and the kit's appbar mark, which v1's bar uses too -->
  <link data-trunk rel="copy-dir" href="assets" />
  <link data-trunk rel="copy-file" href="../../quilt-ui-kit/assets/img/quilt.png" data-target-path="assets/img" />
  <!-- fonts -->
  <link rel="stylesheet" href="assets/css/external/400.css" />
  <link rel="stylesheet" href="assets/css/external/500.css" />
  <link rel="stylesheet" href="assets/css/external/700.css" />
  <!-- v2 kit: tokens + every component module, not the gallery chrome. -->
  <link data-trunk rel="css" href="../../quilt-ui-kit/css/normalize.css" />
  <link data-trunk rel="css" href="../../quilt-ui-kit/css/tokens.css" />
  <link data-trunk rel="css" href="../../quilt-ui-kit/css/base.css" />
  <link data-trunk rel="css" href="../../quilt-ui-kit/css/kit-modules.css" />
  <link data-trunk rel="css" href="assets/css/kit/modules.css" />
  <!-- base styles -->
  <link rel="stylesheet" href="assets/css/theme.css" />
  <link rel="stylesheet" href="assets/css/layout.css" />
  <!-- app-wide popups, toasts and the update bar -->
  <link rel="stylesheet" href="assets/css/views/notify.css" />
  <link rel="stylesheet" href="assets/css/views/toasts.css" />
  <link rel="stylesheet" href="assets/css/views/popup.css" />
  <!-- components -->
  <link rel="stylesheet" href="assets/css/components/button.css" />
  <link rel="stylesheet" href="assets/css/components/ignore-popup.css" />
  <link rel="stylesheet" href="assets/css/components/quit-prompt.css" />
  <!-- json editor for commit page -->
  <script src="assets/js/json-editor.js"></script>
  <!-- WASM -->
  <link data-trunk rel="rust" data-bin="quilt-sync-ui" data-wasm-opt="z" />
</head>
<body></body>
</html>
