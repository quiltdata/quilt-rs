[package]
name = "quilt-rs"
description = "Rust library for versioning data packages: content-addressed manifests, local domains, and S3 remotes."
keywords = ["data", "versioning", "s3", "manifest", "reproducibility"]
categories = ["filesystem", "science", "api-bindings"]

# Inherit from workspace
version = "0.49.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
# Exposes the in-memory mock `Remote`/`Storage` implementations so downstream
# crates can drive quilt-rs flows against a fake bucket in their own tests.
testing = []

[dependencies]
async-trait.workspace = true
base64.workspace = true
bytes.workspace = true
aws-config.workspace = true
aws-credential-types.workspace = true
aws-sdk-s3.workspace = true
aws-smithy-checksums.workspace = true
aws-smithy-http-client.workspace = true
aws-smithy-runtime-api.workspace = true
aws-smithy-types.workspace = true
aws-types.workspace = true
chrono.workspace = true
getrandom.workspace = true
gitignores.workspace = true
hex.workspace = true
http-body.workspace = true
ignore.workspace = true
jsonschema.workspace = true
multibase.workspace = true
multihash.workspace = true
percent-encoding.workspace = true
regex.workspace = true
reqwest.workspace = true
reqwest-middleware.workspace = true
reqwest-retry.workspace = true
serde.workspace = true
serde_json.workspace = true
serde-json-fmt.workspace = true
sha2.workspace = true
serde-saphyr.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-rusqlite.workspace = true
tokio-stream.workspace = true
tracing.workspace = true
quilt-uri = { path = "../quilt-uri", version = "0.4.3" }
url.workspace = true
uuid.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "linux", target_os = "android"))'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
] }

[dev-dependencies]
aws-config = { workspace = true, features = ["test-util"] }
quilt-uri = { path = "../quilt-uri", version = "0.4.3", features = ["test-support"] }
test-log.workspace = true

[lints]
workspace = true
