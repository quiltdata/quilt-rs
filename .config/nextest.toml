# Tests that touch the shared S3 fixtures are named `live_*`. A pull request
# from a fork gets no secrets from GitHub, so CI selects this profile there.
[profile.no-aws]
default-filter = 'not test(/::live_/)'

# Of those, the ones that write to S3 are named `live_write_*`. Some push a
# fixture package and then restore it, so two at once would see each other's
# in-between revisions. This group runs them one at a time within a run; CI
# keeps runs apart with a concurrency group. The other `live_*` tests only
# read pinned fixtures no writer touches, so they stay parallel.
[test-groups]
live-write = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'test(/::live_write_/)'
test-group = 'live-write'

# The tests of code that behaves differently by OS: paths and separators, file
# stamps, locking, permissions, deleting open files, spawning processes, and
# where settings live. Pull requests run only these on macOS and Windows. On
# `main`, Windows runs the whole suite, and macOS QuiltSync's alone. No
# `live_*` tests, so a fork gets them too.
# `check-os-sensitive.sh` fails when a file that branches on the OS has no
# test here.
[profile.os-sensitive]
default-filter = '''
not test(/::live_/) and (
    (package(quilt-rs) and test(/^(auth::tests|file_stamp|io::storage|package_lock|paths|quiltignore|stat_cache|state_store)::/))
    or (package(quilt-rs) and test(/^flow::(create_package|gc|install_package|remove_revisions|status|uninstall_package|uninstall_paths)::/))
    or (package(quilt-rs) and test(/^installed_package::(stat_cache_tests|sync_flow_tests)::/))
    or (package(quilt-cli) and (binary(two_processes) or test(/^cli::(home|tests|undo_commit)::/)))
    or (package(quilt-sync) and test(/^(autopull::(last_change|tests)|commands::settings|fswatcher|tasks)::/))
)
'''
